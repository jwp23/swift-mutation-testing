name: Pull Request Analysis

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-code-changes: ${{ steps.check.outputs.has-code-changes }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for non-Markdown changes
        id: check
        run: |
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if [ -n "$changed_files" ] && echo "$changed_files" | grep -qvi '\.md$'; then
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
          fi

  validate-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code-changes == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Run tests
        run: swift test --no-parallel

  two-run-race-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code-changes == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Run two-run race test
        run: Scripts/two-run-race-test.sh
