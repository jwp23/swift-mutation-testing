name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-release-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-release-
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$VERSION_INPUT"
            [[ ! $VERSION =~ ^v ]] && VERSION="v$VERSION"
          else
            VERSION="$REF_NAME"
          fi
          # Reject anything that is not vMAJOR.MINOR.PATCH[-prerelease]: the version is
          # interpolated into a sed replacement, a filename and a release tag downstream, and
          # the allowed characters carry no special meaning in any of them.
          VERSION_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! $VERSION =~ $VERSION_PATTERN ]]; then
            echo "::error::Release version '$VERSION' is not of the form vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=swift-mutation-testing-$VERSION-macos.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Inject version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          sed -i '' "s/0.0.0-dev/$VERSION/" Sources/SwiftMutationTesting/Version.swift

      - name: Build
        run: swift build -c release

      - name: Package
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          mkdir -p release
          cp .build/release/swift-mutation-testing release/
          cd release && tar -czf "$ARTIFACT_NAME" swift-mutation-testing

      - name: Upload artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: gh release upload "$RELEASE_VERSION" "release/$ARTIFACT_NAME"
